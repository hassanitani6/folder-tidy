name: Feature request
description: Suggest a new kind of rule, option or command.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What kind of folder is it for?
    validations:
      required: true
