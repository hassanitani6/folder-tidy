[project]
name = "folder-tidy"
version = "0.1.0"
description = "Sort a messy folder by rules you write: preview every move first, never replace a file, undo any run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["organize", "files", "folders", "undo", "dry-run", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: System :: Filesystems", "Topic :: Utilities"]

[project.scripts]
folder-tidy = "folder_tidy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folder_tidy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
